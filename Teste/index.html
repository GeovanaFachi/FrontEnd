<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Botão Interativo</title>
    <style>
        .meu-botao, .botao2 {
            background-color: #ffffff;
            color: rgb(218, 214, 15);
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .meu-botao:hover, .botao2:hover {
            background-color: #d11c49;
        }
        .botao2 img, .meu-botao img {
            width: 50px;
            height: 50px;
        }

        .resultado {
            font-family: calibri;
            background-color: #ffffff;
            color: rgb(0, 0, 0);
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 30px; 
        }
        .resultado:hover {
            background-color: #97e783;
        }

    </style>
</head>
<body>
    <button class="meu-botao" onclick="mostrarMensagem()">
        <img src="Sol.jpg">
    </button>
    <button class="botao2" onclick="mostrarMensagem2()">
        <img src="Flor.jpg">
    </button>

    <script>
        function mostrarMensagem() {
            document.getElementById('resultado').innerHTML = "Que dia ensolarado não é mesmo?!";
        }
        function mostrarMensagem2() {
            document.getElementById('resultado').innerHTML = "Bom dia flor do dia";
        }
    </script>

    <div class="resultado" id="resultado"></div>
</body>
</html>
